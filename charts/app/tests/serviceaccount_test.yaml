---
suite: serviceaccount
templates:
  - serviceaccount.yaml
values:
  - ./values/base.yaml
tests:
  - it: is created by default without token automount
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-app
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: renders templated annotations
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/example
        example.com/release: "{{ .Release.Name }}"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/example
      - equal:
          path: metadata.annotations["example.com/release"]
          value: RELEASE-NAME

  - it: is not rendered when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
