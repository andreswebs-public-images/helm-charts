---
suite: service
templates:
  - service.yaml
values:
  - ./values/base.yaml
tests:
  - it: renders a ClusterIP Service selecting the pods
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: app
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: honours the service type
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: fails without ports
    set:
      service.ports: []
    asserts:
      - failedTemplate:
          errorPattern: service.ports must be set

  - it: is not rendered when disabled
    set:
      service.enabled: false
    asserts:
      - hasDocuments:
          count: 0
