{{- if include "app.pdb.applicable" . }}
{{- $minSet := not (kindIs "invalid" .Values.pdb.minAvailable) }}
{{- $maxSet := not (kindIs "invalid" .Values.pdb.maxUnavailable) }}
{{- if and $minSet $maxSet }}
{{- fail "pdb.minAvailable and pdb.maxUnavailable are mutually exclusive; set one of them to null" }}
{{- end }}
{{- if not (or $minSet $maxSet) }}
{{- fail "one of pdb.minAvailable or pdb.maxUnavailable must be set" }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.metadata.labels" (dict "extra" .Values.pdb.labels "context" $) | nindent 4 }}
  {{- with .Values.pdb.annotations }}
  annotations:
    {{- include "app.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- if $minSet }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
{{- end }}
